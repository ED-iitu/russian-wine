version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: russian-wine-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - wine-network

  nginx:
    image: nginx:alpine
    container_name: russian-wine-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - wine-network

  db:
    image: mysql:8.0
    container_name: russian-wine-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: russian_wine
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: wine_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./wine.sql:/docker-entrypoint-initdb.d/wine.sql
    networks:
      - wine-network

networks:
  wine-network:
    driver: bridge

volumes:
  dbdata:
